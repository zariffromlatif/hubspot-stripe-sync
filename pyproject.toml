[project]
name = "hubspot-stripe-sync"
version = "0.1.0"
description = "Two-way Stripe <-> HubSpot sync: signed webhooks, idempotency, loop prevention, retries, dead-letter queue and alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs_stripe_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
